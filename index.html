<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Task Manager</title>
</head>
<body class="bg-gray-200">

    <section id="auth-interface" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-100 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-300">
            <h2 class="text-3xl font-bold text-black mb-6 text-center">Bienvenue</h2>
            <div class="flex flex-col gap-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 rounded-xl border-2 border-gray-400 outline-none focus:border-indigo-500 bg-white">
                <input type="password" id="password" placeholder="Mot de passe" class="w-full p-3 rounded-xl border-2 border-gray-400 outline-none focus:border-indigo-500 bg-white">
                <div class="flex gap-2 mt-2">
                    <button onclick="signIn()" class="flex-1 bg-gray-300 border-2 border-gray-400 py-2 rounded-full font-bold hover:bg-gray-400 cursor-pointer">Se connecter</button>
                    <button onclick="signUp()" class="flex-1 bg-white border-2 border-gray-300 py-2 rounded-full font-bold hover:bg-gray-100 cursor-pointer">S'inscrire</button>
                </div>
            </div>
        </div>
    </section>

    <main id="app-interface" class="hidden max-w-4xl mx-auto p-4">
        <header class="bg-gray-100 p-6 rounded-md shadow-lg flex justify-between items-center">
            <h1 class="text-3xl font-bold">Task Manager</h1>
            <nav class="flex items-center gap-4">
                <ul class="flex gap-2 bg-white p-1 rounded-full shadow">
                    <li><button class="nav-btn px-4 py-1 rounded-full bg-gray-300 font-bold" data-filter="all">Toutes</button></li>
                    <li><button class="nav-btn px-4 py-1 rounded-full" data-filter="completed">Complétées</button></li>
                    <li><button class="nav-btn px-4 py-1 rounded-full" data-filter="todo">En cours</button></li>
                </ul>
                <button onclick="signOut()" class="text-red-600 font-bold hover:underline">Déconnexion</button>
            </nav>
        </header>

        <section class="mt-6 bg-white p-6 rounded-xl shadow-md">
            <input type="text" id="taskInput" placeholder="Quelle est la tâche ?" class="w-full p-4 rounded-xl border-2 border-gray-300 outline-none focus:border-indigo-500">
            <button id="addBtn" class="mt-4 w-full bg-indigo-600 text-white py-3 rounded-full font-bold hover:bg-indigo-700 transition shadow-lg">+ Ajouter une tâche</button>
        </section>

        <section class="mt-8">
            <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                <table class="w-full text-left">
                    <tbody id="taskList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
